<!doctype html><html lang="ko"><meta charset="utf-8"><body>
<span id="status" style="font:13px sans-serif;color:#6b7684">실시간 수신 준비 중…</span>
<script src="realtime.js"></script>
<script>
let client, binding = '';
const post = (type, extra) => window.parent.postMessage({isStreamlitMessage:true,type,...extra},window.location.origin);
window.addEventListener('message', e => {
  if (e.source !== window.parent || e.origin !== window.location.origin || e.data.type !== 'streamlit:render') return;
  const args = e.data.args || {};
  const next = JSON.stringify([args.url,args.api_key,args.scope,args.restart]);
  if (binding !== next) {
    if (client) client.stop();
    binding = next;
    client = new SoundRealtime(args, value => {
      document.getElementById('status').textContent = ({connected:'실시간 수신 연결됨',changed:'새 요청·답변 반영 중',auth:'수신 권한 확인 중',offline:'연결이 끊겼어요 · 재연결 중',error:'실시간 연결 실패 · 다시 연결을 눌러 주세요',expired:'예배방 또는 접속 시간이 끝났어요'})[value.status] || '연결 중';
      post('streamlit:setComponentValue',{value,dataType:'json'});
    });
    client.start();
  }
  client.authorize(args);
  post('streamlit:setFrameHeight',{height:24});
});
window.addEventListener('beforeunload',()=>client && client.stop());
document.addEventListener('visibilitychange',()=>{
  if (!document.hidden && client) client.resume();
});
post('streamlit:componentReady',{apiVersion:1});
</script></body></html>
